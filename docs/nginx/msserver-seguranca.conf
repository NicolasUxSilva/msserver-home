# Cabeçalhos de segurança do domínio (docs/SEGURANCA-WORDPRESS.md, item 6). Copiar para
# /etc/nginx/snippets/msserver-seguranca.conf. Incluído no "server" e em cada "location" que tem o
# seu próprio add_header (o nginx não herda add_header nesses blocos).
#
# HSTS: comece com max-age curto (5 minutos) só depois que TODO o http:// redirecionar para https://
# (item 3). Validado o site, suba para 15552000 (6 meses): a partir daí, os navegadores recusam http.
add_header Strict-Transport-Security "max-age=300" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
