# ———————————————————————————————————————————————————————————————————————————————
# Exemplo de configuração do nginx para servir o site novo (build estático) e o WordPress no mesmo
# domínio. NÃO É APLICADO AUTOMATICAMENTE: o administrador do servidor adapta à configuração atual
# (que não é visível daqui), aplica primeiro em homologação, com backup e plano de volta
# (docs/ROTEAMENTO.md e docs/DEPLOY.md).
#
# Ideia: o site novo responde só pelas rotas GET/HEAD da lista gerada no build
# (dist/_rotas/nginx-rotas.map) e sem parâmetros do WordPress na URL; todo o resto — POST, AJAX,
# /wp-json/, /wp-admin/, login, conta, suporte, postagens novas, landings — continua no WordPress
# exatamente como hoje. Não há "fallback" genérico para o site novo.
#
# Caminhos usados abaixo (ajuste):
#   /var/www/msserver-site/current   → conteúdo do dist/ publicado (link simbólico para a versão ativa)
#   /var/www/wordpress               → raiz atual do WordPress
#   unix:/run/php/php-fpm.sock       → PHP-FPM atual
# ———————————————————————————————————————————————————————————————————————————————

# ——— Contexto http (fora do server) ———

# 1 = página do site novo; 2 = /carrinho/ (aceita ?add-to-cart=); 0 = WordPress.
map $uri $msserver_rota {
    default 0;
    include /var/www/msserver-site/current/_rotas/nginx-rotas.map;
}

# Parâmetros que só o WordPress entende: com eles, a requisição vai para o WordPress mesmo numa rota
# do site novo (ex.: /?s=busca, /?wc-ajax=…, /?p=123, /?page_id=3, /?preview=true, /?rest_route=…).
map $args $msserver_query_wp {
    default 0;
    "~(^|&)(s|p|page_id|preview|preview_id|preview_nonce|rest_route|wc-ajax|post_type|attachment_id|feed|cat|tag|author|m|year|monthnum|day|replytocom|wc-api|order|key|pay_for_order)=" 1;
}

map $args $msserver_add_to_cart {
    default 0;
    "~(^|&)add-to-cart=" 1;
}

# Decisão final: só GET/HEAD, rota da lista, sem parâmetro do WordPress; ?add-to-cart= só em /carrinho/.
map "$request_method|$msserver_rota|$msserver_query_wp|$msserver_add_to_cart" $msserver_novo {
    default 0;
    "~^(GET|HEAD)\|1\|0\|0$" 1;
    "~^(GET|HEAD)\|2\|0\|[01]$" 1;
}

# ——— HTTP → HTTPS (todas as URLs, não só a home) ———
server {
    listen 80;
    listen [::]:80;
    server_name msserver.com.br www.msserver.com.br;
    return 301 https://msserver.com.br$request_uri;
}

# ——— Site ———
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name msserver.com.br;
    # (certificado: manter a configuração atual de ssl_certificate / ssl_certificate_key)

    root /var/www/wordpress;
    index index.php;

    # Cabeçalhos de segurança recomendados (docs/SEGURANCA-WORDPRESS.md). Testar em homologação:
    # o HSTS, depois de publicado, faz os navegadores recusarem http por 6 meses.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 1. Arquivos do build (nomes com hash: cache longo).
    location ^~ /_astro/ {
        root /var/www/msserver-site/current;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ^~ /solucoes-cloud/_astro/ {
        root /var/www/msserver-site/current;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 2. Bloqueios de pagamento (enquanto o gateway estiver ativo no WooCommerce; o plugin
    #    wordpress/msserver-orcamento faz o mesmo dentro do WordPress).
    location = /wp-json/wc/store/v1/checkout {
        if ($request_method != GET) { return 403; }
        try_files $uri $uri/ /index.php?$args;
    }
    location ^~ /finalizar-compra/order-pay/ {
        return 302 /finalizar-compra/;
    }
    if ($args ~ "(^|&)wc-ajax=checkout(&|$)") {
        return 403;
    }

    # 3. Redirecionamentos de URLs antigas (docs/ROTEAMENTO.md, "URLs antigas e duplicadas").
    #    Ficam comentados até a aprovação da MSSERVER (campanhas e links externos podem usar estas URLs).
    # location = /solucoes-cloud-msserver/ { return 301 /solucoes-cloud/; }
    # location = /cloud/                    { return 301 /solucoes-cloud/; }
    # location = /servidores-dedicados/     { return 301 /servidores-fisicos/; }
    # location = /teste/                    { return 301 /; }
    # location = /pagina-exemplo/           { return 301 /; }
    # location = /ticket_channel/standard-ticket-form/ { return 301 /obter-suporte/; }

    # 4. Decisão: site novo ou WordPress.
    location / {
        if ($msserver_novo) {
            rewrite ^ /@site-novo$uri last;
        }
        try_files $uri $uri/ /index.php?$args;   # WordPress (como hoje)
    }

    location ^~ /@site-novo/ {
        internal;
        root /var/www/msserver-site/current;
        rewrite ^/@site-novo(/.*)$ $1 break;
        add_header X-Msserver-Origem "site-novo" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/index.html =404;
        error_page 404 /404.html;
    }

    location = /404.html {
        root /var/www/msserver-site/current;
        internal;
    }

    # 5. WordPress (manter a configuração atual de PHP).
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}

# www → domínio principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.msserver.com.br;
    return 301 https://msserver.com.br$request_uri;
}
